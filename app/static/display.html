<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Public TV Queue Display - Clinic Management System</title>
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23059669'/%3E%3Cpath d='M27 12h10v15h15v10H37v15H27V37H12V27h15z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] p-4 sm:p-6 md:p-10 font-sans flex flex-col justify-between select-none">

  <!-- TV top header -->
  <header class="flex flex-wrap justify-between items-center gap-4 border-b border-slate-800 pb-4 sm:pb-6">
    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
      <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-900/50 shrink-0" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon icon-fill w-8 h-8"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2z"/></svg>
      </div>
      <div class="min-w-0">
        <h1 class="tv-title font-black tracking-tight text-white uppercase truncate">City Health Clinic</h1>
        <p class="text-xs sm:text-sm font-semibold text-brand-400 tracking-wider">Patient Queue Display System</p>
      </div>
    </div>

    <!-- Live clock & audio toggle -->
    <div class="flex items-center gap-4 sm:gap-6 shrink-0">
      <button id="audioToggleBtn" onclick="toggleAudio()" class="btn btn-sm !min-h-[44px] rounded-xl uppercase tracking-wider !bg-slate-900 !border !border-slate-700 hover:!border-brand-500 !text-slate-300">
        <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-bell"/></svg>
        Audio: <span id="audioStatus" class="text-amber-400 font-bold">Click to Enable</span>
      </button>

      <div class="text-right">
        <div id="tvClock" class="tv-clock font-mono font-bold text-white tracking-widest">--:--:--</div>
        <div id="tvDate" class="text-xs font-medium text-slate-400">Loading date...</div>
      </div>
    </div>
  </header>

  <!-- TV center display: NOW SERVING -->
  <main class="my-auto py-6 sm:py-8">
    <div class="max-w-5xl mx-auto">
      <div id="servingCard" class="called-highlight bg-slate-900/90 border-2 border-brand-500 rounded-3xl p-6 sm:p-8 md:p-12 text-center shadow-2xl backdrop-blur-md">
        <div class="flex items-center justify-center gap-3 mb-2">
          <span class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-brand-400 animate-ping" aria-hidden="true"></span>
          <span class="text-base sm:text-lg md:text-2xl font-extrabold uppercase tracking-widest text-brand-400">NOW SERVING / 請就診</span>
        </div>

        <div id="displayTicket" class="tv-ticket font-black text-white tracking-wider my-3 sm:my-4 font-mono">
          None
        </div>

        <div class="inline-block mt-2 px-4 sm:px-6 py-2 rounded-2xl bg-brand-950/60 border border-brand-500/40 text-brand-300 font-bold text-lg sm:text-2xl md:text-3xl">
          Please proceed to <span id="displayRoom" class="text-white font-extrabold">Room N/A</span>
        </div>
      </div>
    </div>
  </main>

  <!-- TV lower section: upcoming waiting queue -->
  <footer class="border-t border-slate-800 pt-4 sm:pt-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch">
      <!-- Waiting overview -->
      <div class="bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Total Waiting</span>
        <div class="flex items-baseline gap-2">
          <span id="displayWaitingCount" class="text-3xl sm:text-4xl font-black text-brand-400 font-mono">0</span>
          <span class="text-xs text-slate-400">patients</span>
        </div>
        <span class="text-[11px] text-slate-500 mt-1 block">Est. wait: <span id="displayEstWait" class="text-slate-300 font-semibold">0 mins</span></span>
      </div>

      <!-- Upcoming tickets grid -->
      <div class="sm:col-span-2 lg:col-span-3 bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800">
        <div class="flex justify-between items-center mb-2 gap-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Upcoming Waiting Numbers / 候診名單</span>
          <span class="text-[11px] text-brand-400 font-mono flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse" aria-hidden="true"></span> Live Synchronized
          </span>
        </div>

        <div id="displayWaitingList" class="flex flex-wrap gap-2.5 min-h-[48px] items-center">
          <span class="text-xs text-slate-500">No patients waiting in queue.</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Minimal icon sprite for this page -->
  <svg xmlns="http://www.w3.org/2000/svg" class="absolute h-0 w-0 overflow-hidden" aria-hidden="true">
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
  </svg>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('tvClock').textContent = now.toLocaleTimeString();
      document.getElementById('tvDate').textContent = now.toLocaleDateString(undefined, {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Audio Chime Synthesis using Web Audio API
    let audioCtx = null;
    let audioEnabled = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioEnabled = true;
      document.getElementById('audioStatus').textContent = 'ENABLED';
      document.getElementById('audioStatus').className = 'text-brand-400 font-bold';
    }

    function toggleAudio() {
      initAudio();
      playChime();
    }

    function playChime() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        // Tone 1: 587.33 Hz (D5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.85);

        // Tone 2: 880.00 Hz (A5)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.25);
        gain2.gain.setValueAtTime(0, now + 0.25);
        gain2.gain.linearRampToValueAtTime(0.35, now + 0.3);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 1.25);
      } catch (err) {
        console.warn('Audio chime error:', err);
      }
    }

    // Queue State & Updates
    let lastServing = null;
    let lastChimedTicket = null;

    function notifyNewServing(ticket) {
      if (ticket && ticket !== 'None' && ticket !== lastChimedTicket) {
        lastChimedTicket = ticket;
        playChime();
      }
    }

    function renderQueue(data) {
      const current = data.currently_serving || 'None';
      const room = data.currently_serving_room || 'Room N/A';
      const waiting = data.waiting_tickets || [];
      const waitCount = data.waiting_count !== undefined ? data.waiting_count : waiting.length;
      const waitMins = data.estimated_wait_minutes || (waitCount * 10);

      const ticketEl = document.getElementById('displayTicket');
      const roomEl = document.getElementById('displayRoom');
      const countEl = document.getElementById('displayWaitingCount');
      const estEl = document.getElementById('displayEstWait');
      const listEl = document.getElementById('displayWaitingList');

      if (ticketEl) ticketEl.textContent = current;
      if (roomEl) roomEl.textContent = room;
      if (countEl) countEl.textContent = waitCount;
      if (estEl) estEl.textContent = waitMins + ' mins';

      // Chime once if new patient called (deduplicated via notifyNewServing)
      if (current !== 'None' && lastServing !== null && current !== lastServing) {
        notifyNewServing(current);
      }
      lastServing = current;

      if (listEl) {
        if (waiting.length === 0) {
          listEl.innerHTML = '<span class="text-xs text-slate-500">No patients waiting in queue.</span>';
        } else {
          listEl.innerHTML = waiting.map((t, idx) => `
            <div class="px-3.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold font-mono text-brand-300 flex items-center gap-2">
              <span class="text-[10px] text-slate-400 font-sans">#${idx + 1}</span>
              <span>${t}</span>
            </div>
          `).join('');
        }
      }
    }

    async function fetchQueueStatus() {
      try {
        const res = await fetch('/api/queue/live-status');
        if (res.ok) {
          const data = await res.json();
          renderQueue(data);
        }
      } catch (err) {
        console.warn('Polling error:', err);
      }
    }

    // WebSocket connection with exponential backoff reconnect
    let ws = null;
    let wsRetryMs = 1000;
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/queue/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        wsRetryMs = 1000;
        fetchQueueStatus();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === 'PATIENT_CALLED' && data.ticket_number) {
            notifyNewServing(data.ticket_number);
          }
          fetchQueueStatus();
        } catch (e) {
          fetchQueueStatus();
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, wsRetryMs);
        wsRetryMs = Math.min(wsRetryMs * 2, 15000);
      };

      ws.onerror = () => {
        if (ws) ws.close();
      };
    }

    connectWS();
    fetchQueueStatus();
    setInterval(fetchQueueStatus, 5000);
  </script>
</body>
</html>
