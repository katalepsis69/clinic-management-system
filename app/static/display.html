<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Public TV Queue Display - Clinic Management System</title>
  <meta name="theme-color" content="#121614">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d6a3f'/%3E%3Cpath d='M27 12h10v15h15v10H37v15H27V37H12V27h15z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    /* ponytail: native mobile touch-callout & selection lock */
    body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body class="bg-[#121614] text-stone-100 min-h-[100dvh] p-4 sm:p-6 md:p-10 font-sans flex flex-col justify-between select-none">

  <!-- SVG icon sprite (Phosphor Regular 256x256, stroke = currentColor) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="absolute h-0 w-0 overflow-hidden" aria-hidden="true">
    <symbol id="i-cross" viewBox="0 0 256 256"><path d="M96,160H40a8,8,0,0,1-8-8V104a8,8,0,0,1,8-8H96V40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8V96h56a8,8,0,0,1,8,8v48a8,8,0,0,1-8,8H160v56a8,8,0,0,1-8,8H104a8,8,0,0,1-8-8V160Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
    <symbol id="i-bell" viewBox="0 0 256 256"><path d="M96,192a32,32,0,0,0,64,0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M56,104a72,72,0,0,1,144,0c0,35.82,8.3,64.6,14.9,76A8,8,0,0,1,208,192H48a8,8,0,0,1-6.88-12C47.71,168.6,56,139.81,56,104Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
    <symbol id="i-tv" viewBox="0 0 256 256"><rect x="32" y="72" width="192" height="136" rx="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="80 24 128 72 176 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><circle cx="188" cy="116" r="12"/><circle cx="188" cy="164" r="12"/><line x1="152" y1="208" x2="152" y2="72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 256 256"><line x1="96" y1="56" x2="96" y2="200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M24,160a32,32,0,0,0,0-64V64a8,8,0,0,1,8-8H224a8,8,0,0,1,8,8V96a32,32,0,0,0,0,64v32a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 256 256"><circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="128 72 128 128 184 128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
  </svg>

  <!-- TV top header -->
  <header class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 sm:gap-4 border-b border-[#232c25] pb-4 sm:pb-6">
    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
      <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-brand-600 text-white flex items-center justify-center shadow-lg shadow-black/40 shrink-0" aria-hidden="true">
        <svg class="icon w-7 h-7 sm:w-8 sm:h-8"><use href="#i-cross"/></svg>
      </div>
      <div class="min-w-0">
        <h1 class="tv-title font-black tracking-tight text-white uppercase truncate">City Health Clinic</h1>
        <p class="text-xs sm:text-sm font-semibold text-brand-400 tracking-wider">Patient Queue Display System</p>
      </div>
    </div>

    <!-- Live clock & audio toggle -->
    <div class="flex items-center justify-between sm:justify-end gap-3 sm:gap-6 w-full sm:w-auto shrink-0">
      <button id="audioToggleBtn" onclick="toggleAudio()" class="btn btn-sm !min-h-[44px] rounded-xl uppercase tracking-wider !bg-[#1a211d] !border !border-[#2e3b31] hover:!border-brand-500 !text-stone-300">
        <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-bell"/></svg>
        Audio: <span id="audioStatus" class="text-amber-400 font-bold">Click to Enable</span>
      </button>

      <div class="text-right">
        <div id="tvClock" class="tv-clock font-mono font-bold text-white tracking-widest tabular-nums">--:--:--</div>
        <div id="tvDate" class="text-xs font-medium text-stone-400 whitespace-nowrap">Loading date...</div>
      </div>
    </div>
  </header>

  <!-- TV center display: NOW SERVING -->
  <main class="my-auto py-6 sm:py-8">
    <div class="max-w-5xl mx-auto">
      <div id="servingCard" class="called-highlight bg-[#1a211d]/90 border-2 border-[#2e3b31] rounded-3xl p-6 sm:p-8 md:p-12 text-center shadow-2xl backdrop-blur-md transition-all duration-300">
        <div class="flex items-center justify-center gap-3 mb-2">
          <span id="servingDot" class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-brand-400/60" aria-hidden="true"></span>
          <span id="servingLabel" class="text-base sm:text-lg md:text-2xl font-extrabold uppercase tracking-widest text-brand-400">NOW SERVING</span>
        </div>

        <div id="displayTicket" class="tv-ticket font-black text-stone-400 tracking-wider my-3 sm:my-4 font-mono tabular-nums">
          STANDBY
        </div>

        <div id="displayRoomContainer" class="inline-block mt-2 px-4 sm:px-6 py-2 rounded-2xl bg-brand-950/80 border border-brand-500/40 text-brand-300 font-bold text-base sm:text-xl md:text-2xl">
          <span id="displayRoomPrefix"></span><span id="displayRoom" class="text-stone-300 font-semibold">Waiting for next patient call</span>
        </div>
      </div>
    </div>
  </main>

  <!-- TV lower section: upcoming waiting queue -->
  <footer class="border-t border-[#232c25] pt-4 sm:pt-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch">
      <!-- Waiting overview -->
      <div class="bg-[#1a211d] p-4 sm:p-5 rounded-2xl border border-[#2e3b31]">
        <span class="text-xs font-bold uppercase tracking-wider text-stone-400 block mb-1">Total Waiting</span>
        <div class="flex items-baseline gap-2">
          <span id="displayWaitingCount" class="text-3xl sm:text-4xl font-black text-brand-400 font-mono tabular-nums">0</span>
          <span class="text-xs text-stone-400">patients</span>
        </div>
        <span class="text-[11px] text-stone-400 mt-1 block">Est. wait: <span id="displayEstWait" class="text-stone-200 font-semibold">0 mins</span></span>
      </div>

      <!-- Upcoming tickets grid -->
      <div class="sm:col-span-2 lg:col-span-3 bg-[#1a211d] p-4 sm:p-5 rounded-2xl border border-[#2e3b31]">
        <div class="flex justify-between items-center mb-2 gap-3">
          <span class="text-xs font-bold uppercase tracking-wider text-stone-400">Upcoming Waiting Numbers</span>
          <span class="text-[11px] text-brand-400 font-mono flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse" aria-hidden="true"></span> Live Synchronized
          </span>
        </div>

        <div id="displayWaitingList" class="flex flex-wrap gap-2.5 min-h-[48px] items-center">
          <span class="text-xs text-stone-400">No patients waiting in queue.</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Minimal icon sprite for this page (Phosphor Regular) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="absolute h-0 w-0 overflow-hidden" aria-hidden="true">
    <symbol id="i-bell" viewBox="0 0 256 256"><path d="M96,192a32,32,0,0,0,64,0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M56,104a72,72,0,0,1,144,0c0,35.82,8.3,64.6,14.9,76A8,8,0,0,1,208,192H48a8,8,0,0,1-6.88-12C47.71,168.6,56,139.81,56,104Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
    <symbol id="i-cross" viewBox="0 0 256 256"><path d="M96,160H40a8,8,0,0,1-8-8V104a8,8,0,0,1,8-8H96V40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8V96h56a8,8,0,0,1,8,8v48a8,8,0,0,1-8,8H160v56a8,8,0,0,1-8,8H104a8,8,0,0,1-8-8V160Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></symbol>
  </svg>

  <script>
    // ponytail: anti-inspect deterrent; block contextmenu, devtools shortcuts, debugger trap & DOM wipe on inspection
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (
        e.key === 'F12' ||
        ((e.ctrlKey || e.metaKey) && (
          (e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
          ['U', 'S'].includes(e.key.toUpperCase())
        ))
      ) {
        e.preventDefault();
      }
    });

    setInterval(() => {
      const t0 = performance.now();
      // eslint-disable-next-line no-debugger
      debugger;
      if (performance.now() - t0 > 100) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#121614;color:#ef4444;font-family:sans-serif;font-size:20px;font-weight:700;">Developer Tools Detected - Access Disabled</div>';
      }
      console.clear();
    }, 500);

    ['log', 'debug', 'info', 'warn', 'error'].forEach((m) => { console[m] = () => {}; });

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('tvClock').textContent = now.toLocaleTimeString();
      const isNarrow = window.innerWidth < 640;
      document.getElementById('tvDate').textContent = now.toLocaleDateString(undefined, {
        weekday: isNarrow ? 'short' : 'long',
        year: 'numeric',
        month: isNarrow ? 'short' : 'long',
        day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Audio Chime Synthesis using Web Audio API
    let audioCtx = null;
    let audioEnabled = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioEnabled = true;
      document.getElementById('audioStatus').textContent = 'ENABLED';
      document.getElementById('audioStatus').className = 'text-brand-400 font-bold';
    }

    function toggleAudio() {
      initAudio();
      playChime();
    }

    function playChime() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        // Tone 1: 587.33 Hz (D5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        // Tone 2: 880.00 Hz (A5)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.25);
        gain2.gain.setValueAtTime(0, now + 0.25);
        gain2.gain.linearRampToValueAtTime(0.3, now + 0.3);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 1.25);
      } catch (err) {
        console.warn('Audio chime error:', err);
      }
    }

    // Queue State & Updates
    let lastServing = null;
    let lastChimedTicket = null;

    function notifyNewServing(ticket) {
      if (ticket && ticket !== 'None' && ticket !== 'STANDBY' && ticket !== lastChimedTicket) {
        lastChimedTicket = ticket;
        playChime();
      }
    }

    function renderQueue(data) {
      const current = data.currently_serving;
      const isServing = current && current !== 'None' && current !== 'STANDBY';
      const room = data.currently_serving_room || 'Room N/A';
      const waiting = data.waiting_tickets || [];
      const waitCount = data.waiting_count !== undefined ? data.waiting_count : waiting.length;
      const waitMins = data.estimated_wait_minutes || (waitCount * 10);

      const ticketEl = document.getElementById('displayTicket');
      const roomEl = document.getElementById('displayRoom');
      const roomPrefixEl = document.getElementById('displayRoomPrefix');
      const cardEl = document.getElementById('servingCard');
      const dotEl = document.getElementById('servingDot');
      const countEl = document.getElementById('displayWaitingCount');
      const estEl = document.getElementById('displayEstWait');
      const listEl = document.getElementById('displayWaitingList');

      if (ticketEl && roomEl) {
        if (isServing) {
          ticketEl.textContent = current;
          ticketEl.className = 'tv-ticket font-black text-white tracking-wider my-3 sm:my-4 font-mono tabular-nums';
          if (roomPrefixEl) roomPrefixEl.textContent = 'Please proceed to ';
          roomEl.textContent = room;
          roomEl.className = 'text-white font-extrabold';
          if (cardEl) {
            cardEl.classList.remove('border-[#2e3b31]');
            cardEl.classList.add('border-brand-500');
          }
          if (dotEl) {
            dotEl.className = 'w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-brand-400 animate-ping';
          }
        } else {
          ticketEl.textContent = 'STANDBY';
          ticketEl.className = 'text-4xl sm:text-6xl md:text-7xl font-extrabold text-amber-400 tracking-wider my-4 font-sans';
          if (roomPrefixEl) roomPrefixEl.textContent = '';
          roomEl.textContent = 'Waiting for next patient call';
          roomEl.className = 'text-stone-300 font-semibold text-base sm:text-xl';
          if (cardEl) {
            cardEl.classList.remove('border-brand-500');
            cardEl.classList.add('border-[#2e3b31]');
          }
          if (dotEl) {
            dotEl.className = 'w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-amber-400/70 animate-pulse';
          }
        }
      }

      if (countEl) countEl.textContent = waitCount;
      if (estEl) estEl.textContent = waitMins + ' mins';

      // Chime once if new patient called (deduplicated via notifyNewServing)
      if (isServing && lastServing !== null && current !== lastServing) {
        notifyNewServing(current);
      }
      lastServing = isServing ? current : null;

      if (listEl) {
        if (waiting.length === 0) {
          listEl.innerHTML = '<span class="text-xs text-slate-500">No patients waiting in queue.</span>';
        } else {
          // ponytail: tickets are server-generated but escaped anyway — defense in depth
          const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
          listEl.innerHTML = waiting.map((t, idx) => `
            <div class="px-3.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold font-mono text-brand-300 flex items-center gap-2">
              <span class="text-[10px] text-slate-400 font-sans">#${idx + 1}</span>
              <span>${esc(t)}</span>
            </div>
          `).join('');
        }
      }
    }

    async function fetchQueueStatus() {
      try {
        const res = await fetch('/api/queue/live-status');
        if (res.ok) {
          const data = await res.json();
          renderQueue(data);
        }
      } catch (err) {
        console.warn('Polling error:', err);
      }
    }

    // WebSocket connection with exponential backoff reconnect
    let ws = null;
    let wsRetryMs = 1000;
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/queue/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        wsRetryMs = 1000;
        fetchQueueStatus();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === 'PATIENT_CALLED' && data.ticket_number) {
            notifyNewServing(data.ticket_number);
          }
          fetchQueueStatus();
        } catch (e) {
          fetchQueueStatus();
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, wsRetryMs);
        wsRetryMs = Math.min(wsRetryMs * 2, 15000);
      };

      ws.onerror = () => {
        if (ws) ws.close();
      };
    }

    connectWS();
    fetchQueueStatus();
    setInterval(fetchQueueStatus, 5000);
  </script>
</body>
</html>
