services:
  - type: web
    name: one-stop-dental-clinic
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Demo mode enabled by default for fast one-click role sign-in and seeded data.
      # Flip to "false" for production deployments using the First-Run Setup Wizard.
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: DATABASE_URL
        sync: false