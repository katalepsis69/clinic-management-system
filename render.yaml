services:
  - type: web
    name: clinic-management-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # ponytail: thesis/demo artifact, so the deployed profile intentionally runs
      # as a demo: seeded reviewer accounts, no secret management. If this ever
      # becomes a real deployment, flip to "false" and set a strong SECRET_KEY.
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: DATABASE_URL
        sync: false