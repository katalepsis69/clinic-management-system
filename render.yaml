services:
  - type: web
    name: clinic-management-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: clinic-data
      mountPath: /app/data
      sizeGB: 1